services:
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:${MOSQUITTO_VERSION}
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto:/mosquitto
      - ./scripts/mosquitto-docker-entrypoint.sh:/mosquitto-docker-entrypoint.sh:ro
    entrypoint: ["sh", "/mosquitto-docker-entrypoint.sh"]
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    environment:
      - MOSQUITTO_PASSWORD=${MOSQUITTO_PASSWORD}

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:${Z2M_VERSION}
    profiles: [z2m]
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    network_mode: host
    environment:
      - TZ=${TZ}
    devices:
      # Make sure this matches your adapter location.
      - ${Z2MPATH}:/dev/ttyACM0

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION}
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ./homeassistant:/config
      - ./mosquitto:/etc/mosquitto
      - ./zigbee2mqtt:/opt/zigbee2mqtt
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    privileged: true
    network_mode: host

  matter-server:
    container_name: matter-server
    image: ghcr.io/matter-js/matterjs-server:${MATTER_VERSION}
    profiles: [matter]
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./matter-server/data:/data
    environment:
      - STORAGE_PATH=/data
      - LOG_LEVEL=info
      # Use trustasia DCL mirror — original on.dcl.csa-iot.org may be throttled.
      # Unsupported as of now. Waiting for support
      #- MATTER_DCL_PRODUCTION_URL=https://on.main-net.trustasia.com

  music-assistant:
    container_name: music-assistant
    image: ghcr.io/music-assistant/server:${MA_VERSION}
    profiles: [music]
    restart: unless-stopped
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./music-assistant/data:/data
      # Optionally expose your local music library to MA. Uncomment and edit:
      # - /path/to/your/music:/media:ro
    environment:
      - LOG_LEVEL=info
