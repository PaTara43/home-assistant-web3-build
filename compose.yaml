services:
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:${MOSQUITTO_VERSION}
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto:/mosquitto
      - ./scripts/addons_conf/mosquitto/mosquitto-docker-entrypoint.sh:/mosquitto-docker-entrypoint.sh:ro
    entrypoint: ["sh", "/mosquitto-docker-entrypoint.sh"]
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    environment:
      - MOSQUITTO_PASSWORD=${MOSQUITTO_PASSWORD}

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:${Z2M_VERSION}
    profiles: [z2m]
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    network_mode: host
    environment:
      - TZ=${TZ}
    devices:
      # USB: ${Z2MPATH}:/dev/ttyACM0 (auto-detected). TCP/PoE: /dev/null:/dev/null
      # (coordinator is reached over the host network, no device to map).
      - ${Z2M_DEVICE_MAP}

  zigbee2mqtt2:
    container_name: zigbee2mqtt2
    image: koenkk/zigbee2mqtt:${Z2M_VERSION}
    profiles: [z2m2]
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ./zigbee2mqtt2/data:/app/data
      - /run/udev:/run/udev:ro
    network_mode: host
    environment:
      - TZ=${TZ}
    devices:
      # USB: ${Z2M2_PATH}:/dev/ttyACM0. TCP/PoE: /dev/null:/dev/null.
      - ${Z2M2_DEVICE_MAP}

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION}
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ./homeassistant:/config
      - ./mosquitto:/etc/mosquitto
      - ./zigbee2mqtt:/opt/zigbee2mqtt
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    privileged: true
    network_mode: host

  matter-server:
    container_name: matter-server
    image: ghcr.io/matter-js/matterjs-server:${MATTER_VERSION}
    profiles: [matter]
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./matter-server/data:/data
    environment:
      - STORAGE_PATH=/data
      - LOG_LEVEL=info
      # Use trustasia DCL mirror — original on.dcl.csa-iot.org may be throttled.
      # Unsupported as of now. Waiting for support
      #- MATTER_DCL_PRODUCTION_URL=https://on.main-net.trustasia.com

  matter-hub:
    container_name: matter-hub
    image: ghcr.io/riddix/home-assistant-matter-hub:${MATTER_HUB_VERSION}
    profiles: [matter-hub]
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./matter-hub/data:/data
    environment:
      - HAMH_HOME_ASSISTANT_URL=http://localhost:8123/
      - HAMH_HOME_ASSISTANT_ACCESS_TOKEN=${HAMH_HOME_ASSISTANT_ACCESS_TOKEN}
      - HAMH_HTTP_PORT=8482
      - HAMH_LOG_LEVEL=info
      - HAMH_HTTP_AUTH_USERNAME=admin
      - HAMH_HTTP_AUTH_PASSWORD=${HAMH_HTTP_AUTH_PASSWORD}
