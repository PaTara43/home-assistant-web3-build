listener 1883

allow_anonymous false

# Mosquitto 2.1 deprecated the password_file option in favor of the password-file plugin.
# However, the plugin is not shipped in the alpine docker image as of 2.1.2,
# so we keep using the legacy password_file option (will produce a deprecation warning).
# plugin /usr/lib/mosquitto/plugins/mosquitto_password_file.so
# plugin_opt_password_file /mosquitto/passwd
password_file /mosquitto/passwd

# Persist retained messages and queued QoS>0 across restarts.
persistence true
persistence_location /mosquitto/data/

# Log to stdout so `docker logs mosquitto` captures everything.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information